gcaption><strong>小院里的手作摊</strong><p>真实库存被陈列在场景中，顾客走到摊前。</p></figcaption></figure><figure><a href="01-wishes.png"><img src="01-wishes.png" alt="三条生活路线" loading="lazy"></a><figcaption><strong>三条生活路线</strong><p>家园、创作收藏和小摊共用材料与作品。</p></figcaption></figure><figure><a href="03-design-book.png"><img src="03-design-book.png" alt="设计稿永久保留" loading="lazy"></a><figcaption><strong>设计稿永久保留</strong><p>修改设计不会改变已经送出或卖出的实物。</p></figcaption></figure><figure><a href="04-placement.png"><img src="04-placement.png" alt="确认摆放" loading="lazy"></a><figcaption><strong>确认摆放</strong><p>检查入口、墙面、家具和路径；鼠标或方向键调整位置。</p></figcaption></figure><figure><a href="05-home-sign.png"><img src="05-home-sign.png" alt="自己的招牌进入家里" loading="lazy"></a><figcaption><strong>自己的招牌进入家里</strong><p>绘画和文字成为场景中可再次查看的物件。</p></figcaption></figure><figure><a href="07-community.png"><img src="07-community.png" alt="邻里借展与使用" loading="lazy"></a><figcaption><strong>邻里借展与使用</strong><p>实物借出后有唯一去向，可以替换或收回。</p></figcaption></figure><figure><a href="08-stall.png"><img src="08-stall.png" alt="确认接待与成交" loading="lazy"></a><figcaption><strong>确认接待与成交</strong><p>按实际品种结算，同一笔成交不能重复取得收入。</p></figcaption></figure><figure><a href="09-inventory.png"><img src="09-inventory.png" alt="实物仓库" loading="lazy"></a><figcaption><strong>实物仓库</strong><p>每件作品保留当时外观、所在位置与用途。</p></figcaption></figure><figure><a href="10-memories.png"><img src="10-memories.png" alt="真实生活回忆" loading="lazy"></a><figcaption><strong>真实生活回忆</strong><p>保存具体来访、合照与交付经历。</p></figcaption></figure><figure><a href="12-small-workshop.png"><img src="12-small-workshop.png" alt="960 × 640 窗口" loading="lazy"></a><figcaption><strong>960 × 640 窗口</strong><p>保存与制作按钮固定可见，较长内容可以滚动。</p></figcaption></figure></div></main><footer>Godot 4.7.2 · Forward+ · RTX 4070。照片和结果来自独立测试角色；玩家原进度未被测试覆盖。长期经济与儿童试玩仍需继续观察。</footer></html>

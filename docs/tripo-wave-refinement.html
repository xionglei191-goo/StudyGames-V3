<main><header><div><div class="eyebrow">ALPHABET ISLAND / 2026.10.23</div><h1>挥手更自然，衣服少一点牵拉</h1><p>三位角色的同一时刻对比。手掌转向前方，减少高抬肩带来的拉伸。</p></div><nav><a href="tripo-characters-gallery.html">查看全部角色 →</a></nav></header>
